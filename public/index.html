<!DOCTYPE html>
<html lang="zh-CN" data-theme-support>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内衣内裤进销存管理系统</title>
<style>
:root{
  --bg:#f6f4f0; --panel:#ffffff; --panel-2:#fbfaf8; --ink:#1f2328; --ink-2:#5b6470;
  --line:#e3ded6; --line-2:#efeae3; --brand:#b0493f; --brand-soft:#f6e9e6;
  --ok:#2f7a4f; --ok-soft:#e8f3ec; --warn:#a8720f; --warn-soft:#fbf1dd;
  --info:#2a5f9e; --info-soft:#e7eef8; --shadow:0 1px 2px rgba(20,16,10,.06),0 8px 24px rgba(20,16,10,.06);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --panel:#1e2125; --panel-2:#23262b; --ink:#e9e6e1; --ink-2:#a3a9b2;
    --line:#32363c; --line-2:#2a2e33; --brand:#e0897d; --brand-soft:#3a2622;
    --ok:#6fcf97; --ok-soft:#1e3227; --warn:#e3b35c; --warn-soft:#332a18;
    --info:#7fb0ef; --info-soft:#1c2a3c; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1e2125; --panel-2:#23262b; --ink:#e9e6e1; --ink-2:#a3a9b2;
  --line:#32363c; --line-2:#2a2e33; --brand:#e0897d; --brand-soft:#3a2622;
  --ok:#6fcf97; --ok-soft:#1e3227; --warn:#e3b35c; --warn-soft:#332a18;
  --info:#7fb0ef; --info-soft:#1c2a3c; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.side{width:210px;flex:0 0 210px;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:9px;padding:6px 8px 16px}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto}
.logo b{font-size:15px;letter-spacing:.3px;display:block;line-height:1.2}
.logo span{font-size:11px;color:var(--ink-2)}
.navgrp{font-size:11px;color:var(--ink-2);padding:12px 10px 5px;letter-spacing:1px}
.nav{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink-2);display:flex;align-items:center;gap:9px}
.nav:hover{background:var(--panel-2);color:var(--ink)}
.nav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav .ico{width:18px;text-align:center;opacity:.9}
.side .foot{margin-top:14px;padding:10px;border-top:1px solid var(--line-2);font-size:11px;color:var(--ink-2)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px}
.dot.off{background:var(--warn)}
/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:20px 24px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:19px;margin:0 0 2px}
.head p{margin:0;color:var(--ink-2);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card>h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.muted{color:var(--ink-2)}
.small{font-size:12px}
/* ---------- controls ---------- */
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--brand)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp,select.inp{border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:7px 10px;min-width:0}
.inp:focus{outline:2px solid var(--brand);outline-offset:-1px;background:var(--panel)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
label.f .inp{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:2px 5px 2px 10px;font-size:12px}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink-2);padding:0 3px;font-size:14px;line-height:1}
.chip button:hover{color:var(--brand)}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:600}
.t-in{background:var(--ok-soft);color:var(--ok)} .t-out{background:var(--brand-soft);color:var(--brand)}
.t-ret{background:var(--info-soft);color:var(--info)} .t-mat{background:var(--warn-soft);color:var(--warn)}
/* ---------- tables ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap}
thead th{background:var(--panel-2);font-weight:600;font-size:12px;color:var(--ink-2);position:sticky;top:0;z-index:2}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel-2)}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
.sticky-l{position:sticky;left:0;background:var(--panel);z-index:1}
thead .sticky-l{background:var(--panel-2);z-index:3}
tbody tr:hover .sticky-l{background:var(--panel-2)}
.tot{font-weight:700;background:var(--panel-2)}
.zero{color:var(--ink-2);opacity:.45}
.low{color:var(--brand);font-weight:700}
/* matrix */
.mtx th,.mtx td{text-align:center;padding:6px 8px}
.mtx th:first-child,.mtx td:first-child{text-align:left}
.mtx input{width:52px;text-align:center;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:5px 2px;font-variant-numeric:tabular-nums}
.mtx input:focus{outline:2px solid var(--brand);outline-offset:-1px;background:var(--panel)}
.mtx input.has{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.stk{display:block;font-size:10.5px;color:var(--ink-2);margin-top:2px}
.stk.warnv{color:var(--brand)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid rgba(128,128,128,.45);margin-right:6px;vertical-align:-1px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat span{font-size:12px;color:var(--ink-2)}
/* modal */
.mask{position:fixed;inset:0;background:rgba(10,8,6,.5);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;z-index:50;overflow:auto}
.mask.on{display:flex}
.modal{background:var(--panel);border-radius:14px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:720px;padding:20px}
.modal h3{margin:0 0 14px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:24px;opacity:0;transition:.22s;z-index:99;font-size:13px;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:34px 16px;text-align:center;color:var(--ink-2)}
.hr{height:1px;background:var(--line-2);margin:14px 0}
.mobtab{display:none}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{display:none}
  .main{padding:14px 12px 70px}
  .mobtab{display:flex;gap:6px;overflow-x:auto;padding:8px 0 12px;position:sticky;top:0;background:var(--bg);z-index:20}
  .mobtab .nav{width:auto;padding:6px 12px;border:1px solid var(--line);background:var(--panel);border-radius:20px;white-space:nowrap}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media print{.side,.mobtab,.noprint{display:none!important}.main{padding:0}.card{box-shadow:none;break-inside:avoid}
  body.printmode .app{display:none!important}
  body.printmode .mask{display:block;position:static;background:none;padding:0;overflow:visible}
  body.printmode .modal{max-width:100%;border:0;box-shadow:none;padding:0}
  .scroll{overflow:visible!important;border:0}
  thead th{position:static}
  .sticky-l{position:static}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark">衣</div><div><b>内裤进销存</b><span>款号 · 颜色 · 尺码</span></div></div>
    <div class="navgrp">经营概览</div>
    <button class="nav" data-v="home"><span class="ico">▤</span>首页看板</button>
    <div class="navgrp">日常业务</div>
    <button class="nav" data-v="sale"><span class="ico">↗</span>销售开单</button>
    <button class="nav" data-v="in"><span class="ico">↙</span>成品入库</button>
    <button class="nav" data-v="ret"><span class="ico">↺</span>退货入库</button>
    <div class="navgrp">库存管理</div>
    <button class="nav" data-v="stock"><span class="ico">▦</span>库存明细表</button>
    <button class="nav" data-v="mat"><span class="ico">✚</span>原材料库存</button>
    <div class="navgrp">基础与记录</div>
    <button class="nav" data-v="style"><span class="ico">☰</span>款号档案</button>
    <button class="nav" data-v="bills"><span class="ico">✎</span>单据流水</button>
    <button class="nav" data-v="set"><span class="ico">⚙</span>系统设置</button>
    <div class="foot"><span class="dot off" id="dbdot"></span><span id="dbtxt">正在连接云端…</span></div>
  </aside>
  <main class="main">
    <div class="mobtab" id="mobtab"></div>
    <div id="view"></div>
  </main>
</div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ============ 基础工具 ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>(p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toLocaleDateString("sv-SE");
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const fmt=n=>(Math.round(n*100)/100).toLocaleString("zh-CN");
const money=n=>"¥"+(Math.round(n*100)/100).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
const K=(c,s)=>c+"||"+s;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2000);}
const COLORMAP={"黑色":"#222","白色":"#f4f4f4","灰色":"#9aa0a6","深灰":"#555","藏青":"#1f3160","蓝色":"#2f6fb5","红色":"#c0392b","粉色":"#f0a0b4","肤色":"#e8c3a5","米色":"#e4d5bb","紫色":"#7a5ba6","绿色":"#3f8f5f","咖啡":"#6b4a35","酒红":"#7d2b3a","豆沙":"#b0736f","杏色":"#ecc9a5"};
const swatch=c=>`<span class="swatch" style="background:${COLORMAP[c]||"linear-gradient(135deg,#bbb,#eee)"}"></span>`;
const BILLTYPE={in:{n:"成品入库",c:"t-in",sign:1},sale:{n:"销售出库",c:"t-out",sign:-1},ret:{n:"退货入库",c:"t-ret",sign:1},adj:{n:"库存调整",c:"t-mat",sign:1}};

/* ============ 数据层（Cloudflare Workers + D1） ============ */
let DB=null, DBREADY=false, PIN="";
const S={styles:[],stock:{},bills:[],materials:[],cfg:{lowStock:10,shopName:"",sizePreset:"M,L,XL,2XL,3XL",colorPreset:"黑色,白色,灰色,藏青,肤色"}};
const LKEY="udw_inv_v1", PKEY="udw_inv_pin";
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S));}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(LKEY);if(r)Object.assign(S,JSON.parse(r));}catch(e){}}
function setOffline(msg){DB=null;const d=$("#dbdot"),t=$("#dbtxt");if(d)d.classList.add("off");if(t)t.textContent=msg||"离线暂存模式";}
async function api(path,body){
  const r=await fetch("/api/"+path,{method:body?"POST":"GET",headers:{"content-type":"application/json","x-pin":PIN||""},
    body:body?JSON.stringify(body):undefined});
  if(r.status===401){throw {code:"unauthorized"};}
  if(!r.ok)throw {code:"http_"+r.status};
  return r.json();
}
let QUEUE=Promise.resolve();  // 串行化写入，避免并发覆盖
function enqueue(fn){QUEUE=QUEUE.then(fn).catch(e=>{console.warn(e);});return QUEUE;}
async function putDoc(path,obj){
  saveLocal();
  if(!DB)return;
  return enqueue(async()=>{ try{ await api("put",{path,obj}); }catch(e){ if(e.code==="unauthorized")return gate(); toast("云端保存失败，已暂存本机"); setOffline("云端连接中断"); } });
}
async function delDoc(path){
  saveLocal();
  if(!DB)return;
  return enqueue(async()=>{ try{ await api("del",{path}); }catch(e){ if(e.code==="unauthorized")return gate(); toast("云端删除失败"); } });
}
async function persistStyle(s){ await putDoc("styles/"+s.id,s); }
async function persistStock(sid){ await putDoc("stock/"+sid,{styleId:sid,q:S.stock[sid]||{}}); }
async function persistBill(b){ await putDoc("bills/"+b.id,b); }
async function persistMat(m){ await putDoc("materials/"+m.id,m); }
async function persistCfg(){ await putDoc("meta/cfg",S.cfg); }

function gate(){
  openModal(`<h3>请输入访问口令</h3>
  <p class="small muted">本系统已设置口令保护，输入后本机会记住，不必每次输入。</p>
  <input class="inp" id="pinbox" type="password" style="width:100%" placeholder="访问口令" onkeydown="if(event.key==='Enter')tryPin()">
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn pri" onclick="tryPin()">进入系统</button></div>`);
  setTimeout(()=>{const e=document.getElementById("pinbox");if(e)e.focus();},60);
}
async function tryPin(){
  PIN=document.getElementById("pinbox").value.trim();
  try{ await api("all"); localStorage.setItem(PKEY,PIN); closeModal(); boot(); }
  catch(e){ toast(e.code==="unauthorized"?"口令不正确":"连接失败"); }
}

async function boot(){
  loadLocal();
  const local=JSON.parse(JSON.stringify(S));
  PIN=localStorage.getItem(PKEY)||"";
  render();
  let d=null;
  try{ d=await api("all"); DB=true; }
  catch(e){
    if(e.code==="unauthorized"){ setOffline("等待口令验证"); return gate(); }
    setOffline("离线暂存模式（未连接服务器）"); render(); return;
  }
  S.styles=d.styles||[]; S.stock=d.stock||{}; S.bills=d.bills||[]; S.materials=d.materials||[];
  if(d.cfg)Object.assign(S.cfg,d.cfg);
  if(!S.styles.length&&!S.bills.length&&!S.materials.length&&local.styles&&local.styles.length){
    Object.assign(S,local);
    for(const st2 of S.styles){await persistStyle(st2);await persistStock(st2.id);}
    for(const b of S.bills)await persistBill(b);
    for(const m of S.materials)await persistMat(m);
    await persistCfg();
    toast("已把本机数据上传到云端");
  }
  DBREADY=true; saveLocal();
  $("#dbdot").classList.remove("off");
  $("#dbtxt").textContent="云端数据已连接";
  render();
}

/* ============ 业务计算 ============ */
const styleById=id=>S.styles.find(s=>s.id===id);
const qOf=(sid,c,z)=>num((S.stock[sid]||{})[K(c,z)]);
function styleTotal(sid){const m=S.stock[sid]||{};return Object.values(m).reduce((a,b)=>a+num(b),0);}
const totalQty=()=>S.styles.reduce((a,s)=>a+styleTotal(s.id),0);
function applyBill(b,dir){ // dir=1 应用, -1 撤销
  const sign=BILLTYPE[b.type].sign*dir;
  b.items.forEach(it=>{
    S.stock[it.styleId]=S.stock[it.styleId]||{};
    const k=K(it.color,it.size);
    S.stock[it.styleId][k]=num(S.stock[it.styleId][k])+sign*num(it.qty);
  });
  return [...new Set(b.items.map(i=>i.styleId))];
}
function lowList(){
  const out=[];
  S.styles.forEach(s=>(s.colors||[]).forEach(c=>(s.sizes||[]).forEach(z=>{
    const q=qOf(s.id,c,z);
    if(q<=num(S.cfg.lowStock)) out.push({s,c,z,q});
  })));
  return out.sort((a,b)=>a.q-b.q);
}
function billsOf(day){return S.bills.filter(b=>b.date===day);}

/* ============ 路由 ============ */
let VIEW="home";
const VIEWS={home:"首页看板",sale:"销售开单",in:"成品入库",ret:"退货入库",stock:"库存明细表",mat:"原材料库存",style:"款号档案",bills:"单据流水",set:"系统设置"};
function go(v){VIEW=v;window.scrollTo(0,0);render();}
document.addEventListener("click",e=>{const b=e.target.closest(".nav");if(b)go(b.dataset.v);});
$("#mask").addEventListener("click",e=>{if(e.target.id==="mask")closeModal();});
function openModal(html){$("#modal").innerHTML=html;$("#mask").classList.add("on");}
function closeModal(){$("#mask").classList.remove("on");$("#modal").innerHTML="";}

let POST=null;
function render(){
  const ae=document.activeElement, aid=ae&&ae.id, asel=ae&&ae.selectionStart;
  $$(".side .nav").forEach(b=>b.classList.toggle("on",b.dataset.v===VIEW));
  $("#mobtab").innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button class="nav ${k===VIEW?"on":""}" data-v="${k}">${v}</button>`).join("");
  const f={home:vHome,sale:()=>vEntry("sale"),in:()=>vEntry("in"),ret:()=>vEntry("ret"),stock:vStock,mat:vMat,style:vStyle,bills:vBills,set:vSet}[VIEW]||vHome;
  POST=null;
  $("#view").innerHTML=f();
  if(POST)POST();
  if(aid){const el=document.getElementById(aid);if(el&&el.focus){el.focus();try{el.setSelectionRange(asel,asel);}catch(e){}}}
}

/* ================= 首页看板 ================= */
function vHome(){
  const d=today(), tb=billsOf(d);
  const saleQty=tb.filter(b=>b.type==="sale").reduce((a,b)=>a+b.qty,0);
  const saleAmt=tb.filter(b=>b.type==="sale").reduce((a,b)=>a+b.amount,0);
  const inQty=tb.filter(b=>b.type==="in").reduce((a,b)=>a+b.qty,0);
  const retQty=tb.filter(b=>b.type==="ret").reduce((a,b)=>a+b.qty,0);
  const low=lowList().filter(x=>x.q>0).slice(0,12), zero=lowList().filter(x=>x.q<=0).length;
  const recent=S.bills.slice().sort((a,b)=>b.ts-a.ts).slice(0,8);
  // 近7日销量
  const days=[...Array(7)].map((_,i)=>{const dt=new Date();dt.setDate(dt.getDate()-6+i);return dt.toLocaleDateString("sv-SE");});
  const dayQty=days.map(x=>S.bills.filter(b=>b.date===x&&b.type==="sale").reduce((a,b)=>a+b.qty,0));
  const mx=Math.max(1,...dayQty);
  return `
  <div class="head"><div><h1>首页看板</h1><p>${esc(S.cfg.shopName||"内裤/内衣仓库")} · ${d}</p></div>
    <div class="row noprint">
      <button class="btn pri" data-v="sale" onclick="go('sale')">＋ 销售开单</button>
      <button class="btn" onclick="go('in')">成品入库</button>
      <button class="btn" onclick="go('ret')">退货入库</button>
    </div></div>
  <div class="stats">
    <div class="stat"><span>今日销售（件）</span><b>${fmt(saleQty)}</b></div>
    <div class="stat"><span>今日销售金额</span><b>${money(saleAmt)}</b></div>

/* ================= 开单 / 入库 / 退货（核心矩阵录入） ================= */
let F=null;
function newForm(type){return {type,date:today(),no:genNo(type),partner:"",remark:"",lines:[]};}
function genNo(type){
  const p={sale:"XS",in:"RK",ret:"TH"}[type]||"DJ";
  const d=today().replace(/-/g,"").slice(2);
  const n=S.bills.filter(b=>b.type===type&&b.date===today()).length+1;
  return p+d+String(n).padStart(3,"0");
}
function vEntry(type){
  if(!F||F.type!==type)F=newForm(type);
  POST=updateTotals;
  const T=BILLTYPE[type];
  const avail=S.styles.filter(s=>!F.lines.some(l=>l.styleId===s.id));
  const tip={sale:"按款号逐个添加，横向录入每个颜色 × 尺码的出货数量，保存后自动扣减库存。",
             in:"生产/采购回货登记，横向录入各颜色各尺码的入库数量，保存后自动增加库存。",
             ret:"客户退回的商品登记，横向录入退回的颜色与尺码，保存后自动回补库存。"}[type];
  return `
  <div class="head"><div><h1>${T.n}</h1><p>${tip}</p></div>
    <div class="row noprint"><button class="btn" onclick="F=newForm('${type}');render()">清空重填</button>
    <button class="btn pri" onclick="saveBill()">保存单据（F 键快捷）</button></div></div>
  <div class="card">
    <div class="grid3">
      <label class="f">单据编号<input class="inp" value="${esc(F.no)}" oninput="F.no=this.value"></label>
      <label class="f">单据日期<input class="inp" type="date" value="${F.date}" oninput="F.date=this.value"></label>
      <label class="f">${type==="in"?"供应商 / 车间":"客户 / 门店"}<input class="inp" value="${esc(F.partner)}" placeholder="选填" oninput="F.partner=this.value" list="partners"></label>
    </div>
    <datalist id="partners">${[...new Set(S.bills.map(b=>b.partner).filter(Boolean))].map(p=>`<option value="${esc(p)}">`).join("")}</datalist>
    <div class="hr"></div>
    <div class="row">
      <select class="inp" id="pick" style="min-width:260px">
        <option value="">＋ 选择款号加入单据…</option>
        ${avail.map(s=>`<option value="${s.id}">${esc(s.code)}　${esc(s.name||"")}　(库存 ${styleTotal(s.id)})</option>`).join("")}
      </select>
      <button class="btn" onclick="addLine()">加入</button>
      ${S.styles.length?"":`<span class="small muted">还没有款号，<a href="#" onclick="go('style');return false;">先去建档</a>。</span>`}
    </div>
  </div>
  <div id="lines">${F.lines.map((l,i)=>lineBlock(l,i)).join("")||`<div class="card"><div class="empty">请选择款号，加入后即可横向录入颜色 × 尺码数量。</div></div>`}</div>
  <div class="card" style="position:sticky;bottom:0;z-index:10">
    <div class="row" style="justify-content:space-between">
      <div><span class="muted small">合计件数</span> <b style="font-size:20px" id="grandQty">0</b>
        <span class="muted small" style="margin-left:16px">合计金额</span> <b style="font-size:20px" id="grandAmt">¥0.00</b></div>
      <div class="row"><input class="inp" style="width:220px" placeholder="备注" value="${esc(F.remark)}" oninput="F.remark=this.value">
      <button class="btn pri" onclick="saveBill()">保存并${type==="sale"?"出库":"入库"}</button></div>
    </div>
  </div>`;
}
function lineBlock(l,i){
  const s=styleById(l.styleId); if(!s)return "";
  const sizes=s.sizes||[], colors=s.colors||[];
  return `<div class="card" data-li="${i}">
    <h3><span>${esc(s.code)} <span class="muted" style="font-weight:400">${esc(s.name||"")}</span></span>
      <span class="row">
        <label class="small muted">单价 <input class="inp" style="width:86px;padding:4px 8px" type="number" step="0.01" value="${l.price}" oninput="setPrice(${i},this.value)"></label>
        <button class="btn sm" onclick="fillRow(${i})">整行填充</button>
        <button class="btn sm danger" onclick="delLine(${i})">移除</button>
      </span></h3>
    <div class="scroll"><table class="mtx">
      <thead><tr><th class="sticky-l">颜色 ＼ 尺码</th>${sizes.map(z=>`<th class="num">${esc(z)}</th>`).join("")}<th class="num">小计</th></tr></thead>
      <tbody>
      ${colors.map((c,ci)=>`<tr><td class="sticky-l">${swatch(c)}${esc(c)}</td>
        ${sizes.map((z,zi)=>{
          const stk=qOf(s.id,c,z), v=num(l.qty[K(c,z)]);
          return `<td><input inputmode="numeric" data-i="${i}" data-c="${esc(c)}" data-z="${esc(z)}" class="${v?"has":""}" value="${v||""}" >
            <span class="stk ${F.type==="sale"&&stk<=num(S.cfg.lowStock)?"warnv":""}">库 ${stk}</span></td>`;
        }).join("")}
        <td class="tot num" id="rt-${i}-${ci}">0</td></tr>`).join("")}
      </tbody>
      <tfoot><tr class="tot"><td class="sticky-l tot">尺码合计</td>${sizes.map((z,zi)=>`<td class="num" id="ct-${i}-${zi}">0</td>`).join("")}<td class="num" id="bt-${i}">0</td></tr></tfoot>
    </table></div>
  </div>`;
}
function addLine(){
  const id=$("#pick").value; if(!id)return;
  const s=styleById(id); if(!s)return;
  if(!(s.colors||[]).length||!(s.sizes||[]).length){toast("该款号还没有设置颜色或尺码");return;}
  F.lines.push({styleId:id,qty:{},price:F.type==="in"?num(s.cost):num(s.price)});
  render();
}
function delLine(i){F.lines.splice(i,1);render();}
function setPrice(i,v){F.lines[i].price=num(v);updateTotals();}
function fillRow(i){
  const n=prompt("将该款所有颜色 × 尺码统一填入数量：","0"); if(n===null)return;
  const s=styleById(F.lines[i].styleId);
  (s.colors||[]).forEach(c=>(s.sizes||[]).forEach(z=>{F.lines[i].qty[K(c,z)]=num(n);}));
  render();
}
function updateTotals(){
  let gq=0,ga=0;
  F.lines.forEach((l,i)=>{
    const s=styleById(l.styleId); if(!s)return;
    const sizes=s.sizes||[],colors=s.colors||[];
    let bt=0;
    colors.forEach((c,ci)=>{
      let rt=0; sizes.forEach(z=>rt+=num(l.qty[K(c,z)]));
      const el=document.getElementById("rt-"+i+"-"+ci); if(el)el.textContent=rt||0;
      bt+=rt;
    });
    sizes.forEach((z,zi)=>{
      let ct=0; colors.forEach(c=>ct+=num(l.qty[K(c,z)]));
      const el=document.getElementById("ct-"+i+"-"+zi); if(el)el.textContent=ct||0;
    });
    const be=document.getElementById("bt-"+i); if(be)be.textContent=bt;
    gq+=bt; ga+=bt*num(l.price);
  });
  const a=document.getElementById("grandQty"),b=document.getElementById("grandAmt");
  if(a)a.textContent=fmt(gq); if(b)b.textContent=money(ga);
}
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.matches(".mtx input[data-c]")&&F&&el.dataset.i!==undefined){
    const i=+el.dataset.i,c=el.dataset.c,z=el.dataset.z;
    const v=num(el.value.replace(/[^\d.\-]/g,""));
    F.lines[i].qty[K(c,z)]=v;
    el.classList.toggle("has",!!v);
    updateTotals();
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches(".mtx input[data-c]")){
    const all=$$(".mtx input[data-c]"),k=all.indexOf(e.target);
    if(all[k+1]){all[k+1].focus();all[k+1].select();}
    e.preventDefault();
  }
});
async function saveBill(){
  if(!F.lines.length){toast("请先加入款号并录入数量");return;}
  const items=[];
  F.lines.forEach(l=>{
    const s=styleById(l.styleId); if(!s)return;
    (s.colors||[]).forEach(c=>(s.sizes||[]).forEach(z=>{
      const q=num(l.qty[K(c,z)]);
      if(q>0)items.push({styleId:s.id,styleCode:s.code,styleName:s.name||"",color:c,size:z,qty:q,price:num(l.price)});
    }));
  });
  if(!items.length){toast("数量全部为 0，无法保存");return;}
  if(F.type==="sale"&&!S.cfg.allowNeg){
    const bad=items.filter(it=>qOf(it.styleId,it.color,it.size)<it.qty);
    if(bad.length){
      openModal(`<h3>库存不足，无法出库</h3><div class="scroll"><table><thead><tr><th>款号</th><th>颜色</th><th>尺码</th><th class="num">开单</th><th class="num">现存</th></tr></thead><tbody>
      ${bad.map(b=>`<tr><td>${esc(b.styleCode)}</td><td>${esc(b.color)}</td><td>${esc(b.size)}</td><td class="num low">${b.qty}</td><td class="num">${qOf(b.styleId,b.color,b.size)}</td></tr>`).join("")}
      </tbody></table></div><p class="small muted">如需允许超卖，可在「系统设置」中打开负库存出库。</p>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">返回修改</button></div>`);
      return;
    }
  }
  const b={id:uid("b"),no:F.no||genNo(F.type),type:F.type,date:F.date,ts:Date.now(),partner:F.partner,remark:F.remark,
    items,qty:items.reduce((a,i)=>a+i.qty,0),amount:items.reduce((a,i)=>a+i.qty*i.price,0)};
  const sids=applyBill(b,1);
  S.bills.unshift(b);
  saveLocal();
  await persistBill(b);
  for(const sid of sids) await persistStock(sid);
  toast(BILLTYPE[b.type].n+"已保存："+b.no+"，共 "+b.qty+" 件");
  F=newForm(F.type);
  render();
  showBill(b.id);
}

/* ================= 库存明细表（横向矩阵） ================= */
const SF={kw:"",cat:"",only:"all"};
function vStock(){
  let list=S.styles.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code),"zh"));
  if(SF.kw){const k=SF.kw.toLowerCase();list=list.filter(s=>(s.code+" "+(s.name||"")+" "+(s.cat||"")).toLowerCase().includes(k));}
  if(SF.cat)list=list.filter(s=>s.cat===SF.cat);
  const cats=[...new Set(S.styles.map(s=>s.cat).filter(Boolean))];
  const sizes=[...new Set(list.flatMap(s=>s.sizes||[]))];
  const order=(S.cfg.sizePreset||"").split(",").map(x=>x.trim());
  sizes.sort((a,b)=>{const i=order.indexOf(a),j=order.indexOf(b);return (i<0?99:i)-(j<0?99:j)||String(a).localeCompare(String(b),"zh");});
  const rows=[];
  list.forEach(s=>{
    const cs=(s.colors||[]);
    cs.forEach((c,ci)=>{
      const cells=sizes.map(z=>(s.sizes||[]).includes(z)?qOf(s.id,c,z):null);
      const rt=cells.reduce((a,b)=>a+(b||0),0);
      if(SF.only==="have"&&rt<=0)return;
      if(SF.only==="low"&&!cells.some(v=>v!==null&&v<=num(S.cfg.lowStock)))return;
      rows.push({s,c,ci,cells,rt});
    });
  });
  const colTot=sizes.map((z,zi)=>rows.reduce((a,r)=>a+(r.cells[zi]||0),0));
  const grand=rows.reduce((a,r)=>a+r.rt,0);
  return `
  <div class="head"><div><h1>库存明细表</h1><p>横向查看：款号 → 颜色 → 各尺码数量，最右为该颜色小计。红色为低于安全库存（≤${S.cfg.lowStock}）。</p></div>
    <div class="row noprint">
      <button class="btn" onclick="exportStock()">导出 CSV</button>
      <button class="btn" onclick="window.print()">打印</button>
      <button class="btn pri" onclick="go('sale')">去开单</button>
    </div></div>
  <div class="card noprint"><div class="row">
    <input id="q_stock" class="inp" placeholder="搜索款号 / 品名" value="${esc(SF.kw)}" oninput="SF.kw=this.value;clearTimeout(window._t);window._t=setTimeout(render,250)" style="width:220px">
    <select class="inp" onchange="SF.cat=this.value;render()"><option value="">全部类别</option>${cats.map(c=>`<option ${SF.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <select class="inp" onchange="SF.only=this.value;render()">
      <option value="all" ${SF.only==="all"?"selected":""}>显示全部</option>
      <option value="have" ${SF.only==="have"?"selected":""}>只看有库存</option>
      <option value="low" ${SF.only==="low"?"selected":""}>只看低库存/断码</option>
    </select>
    <span class="muted small">共 ${list.length} 个款号 / ${rows.length} 个颜色行 / 合计 ${fmt(grand)} 件</span>
  </div></div>
  ${rows.length?`<div class="scroll"><table class="mtx">
    <thead><tr><th class="sticky-l">款号 / 颜色</th><th>品名</th>${sizes.map(z=>`<th class="num">${esc(z)}</th>`).join("")}<th class="num">小计</th><th class="num">货值</th></tr></thead>
    <tbody>
    ${rows.map(r=>`<tr>
      <td class="sticky-l">${r.ci===0?`<b>${esc(r.s.code)}</b><br>`:""}<span style="padding-left:${r.ci===0?0:0}px">${swatch(r.c)}${esc(r.c)}</span></td>
      <td class="muted small">${r.ci===0?esc(r.s.name||""):""}</td>
      ${r.cells.map(v=>v===null?`<td class="zero">—</td>`:`<td class="num ${v<=0?"low":(v<=num(S.cfg.lowStock)?"low":"")}">${v}</td>`).join("")}
      <td class="num tot">${r.rt}</td><td class="num muted">${money(r.rt*num(r.s.price))}</td></tr>`).join("")}
    </tbody>
    <tfoot><tr class="tot"><td class="sticky-l tot">全部合计</td><td></td>${colTot.map(v=>`<td class="num">${v}</td>`).join("")}<td class="num">${grand}</td><td class="num">${money(rows.reduce((a,r)=>a+r.rt*num(r.s.price),0))}</td></tr></tfoot>
  </table></div>`:`<div class="card"><div class="empty">没有符合条件的库存记录。</div></div>`}`;
}
async function exportStock(){
  const list=S.styles.slice();
  const sizes=[...new Set(list.flatMap(s=>s.sizes||[]))];
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  let csv=["款号","品名","颜色",...sizes,"小计"].map(q).join(",")+"\n";
  list.forEach(s=>(s.colors||[]).forEach(c=>{
    const cells=sizes.map(z=>(s.sizes||[]).includes(z)?qOf(s.id,c,z):"");
    csv+=[s.code,s.name||"",c,...cells,cells.reduce((a,b)=>a+num(b),0)].map(q).join(",")+"\n";
  }));
  const data="\ufeff"+csv;
  let dl=null; try{ if(window.claude&&claude.use) dl=await claude.use("downloads"); }catch(e){}
  if(dl){ try{ await dl.save({filename:"库存明细_"+today()+".csv",data}); toast("已导出"); }catch(e){ if(e&&e.code!=="declined")toast("导出失败："+(e.code||"")); } }
  else{ const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"}));a.download="库存明细.csv";a.click();toast("已导出"); }
}

async function moveMat(id,d){

function showBill(id){

    <tfoot><tr class="tot"><td class="sticky-l tot">合计</td>${sizes.map(z=>`<td class="num">${colors.reduce((a,c)=>a+get(c,z),0)}</td>`).join("")}<td class="num">${g.items.reduce((a,i)=>a+i.qty,0)}</td></tr></tfoot></table></div></div>`;

    <button class="btn pri" onclick="closeModal()">关闭</button></div>`;
  openModal(html);
}

async function voidBill(id){

async function backup(){
  const data=JSON.stringify({v:1,exportedAt:new Date().toISOString(),data:S},null,1);
  let dl=null; try{ if(window.claude&&claude.use) dl=await claude.use("downloads"); }catch(e){}
  const name="进销存备份_"+today()+".json";
  if(dl){ try{ await dl.save({filename:name,data}); toast("备份已导出"); return; }catch(e){ if(e&&e.code==="declined")return; } }
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;a.click();toast("备份已导出");
}
function restore(inp){
  const f=inp.files&&inp.files[0]; if(!f)return; inp.value="";
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const o=JSON.parse(r.result); const d=o.data||o;
      if(!d||!Array.isArray(d.styles))throw 0;
      if(!confirm("将用备份文件覆盖当前全部数据（款号 "+d.styles.length+" 个、单据 "+((d.bills||[]).length)+" 张）。确定？"))return;
      S.styles=d.styles||[];S.stock=d.stock||{};S.bills=d.bills||[];S.materials=d.materials||[];
      if(d.cfg)Object.assign(S.cfg,d.cfg);
      saveLocal();
      if(DB){ for(const st2 of S.styles){await persistStyle(st2);await persistStock(st2.id);} for(const b of S.bills)await persistBill(b); for(const m of S.materials)await persistMat(m); await persistCfg(); }
      render(); toast("备份已恢复");
    }catch(e){ toast("文件格式不正确，恢复失败"); }
  };
  r.readAsText(f);
}
async function saveCfg(){saveLocal();await persistCfg();toast("设置已保存");}
async function wipe(){
  if(!confirm("将删除全部款号、库存、单据与原材料，且不可恢复。确定？"))return;
  if(!confirm("再次确认：真的要清空所有数据吗？"))return;
  if(DB){ try{ await api("wipe",{confirm:true}); }catch(e){ toast("云端清空失败"); } }
  S.styles=[];S.stock={};S.bills=[];S.materials=[];saveLocal();render();toast("已清空");
}

    const s={id:uid("s"),...d}; S.styles.push(s); S.stock[s.id]={};

    await persistStyle(s); await persistStock(s.id);
  }
  const M=[
    {name:"40S 莫代尔面料",spec:"幅宽160cm 黑",unit:"公斤",qty:320,safe:80,price:42,sup:"华纺纺织"},
    {name:"冰丝面料",spec:"幅宽150cm 藏青",unit:"公斤",qty:150,safe:60,price:38,sup:"华纺纺织"},
    {name:"1.5cm 橡筋",spec:"白色",unit:"米",qty:4200,safe:1000,price:0.35,sup:"永昌辅料"},
    {name:"吊牌 + 合格证",spec:"通用",unit:"套",qty:8600,safe:2000,price:0.12,sup:"印刷厂"},
    {name:"独立包装袋",spec:"OPP 12×18",unit:"个",qty:5200,safe:1500,price:0.08,sup:"永昌辅料"}
  ];
  for(const m of M){const o={id:uid("m"),...m,logs:[{ts:Date.now(),d:1,q:m.qty,note:"期初建档"}]};S.materials.push(o);await persistMat(o);}
  saveLocal(); render(); toast("示例数据已载入");
}

boot();
